<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ゲートランナー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0010;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #container { position: relative; }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="gameCanvas"></canvas>
</div>
<script>
'use strict';

// ======================================================
// 定数
// ======================================================
const LOGICAL_W   = 400;
const LOGICAL_H   = 700;
const PLAYER_Y    = 578;     // プレイヤーのY座標（固定）
const PLAYER_R    = 22;
const ENEMY_R     = 16;
const BOSS_R      = 38;
const GATE_W      = 80;
const GATE_H      = 50;
const GATE_ROWS   = 7;
const ROW_SPACING = 210;     // world-Yでのゲート行間隔
const COURSE_STARTWORLD_Y = 700; // コース先頭のworld-Y（PLAYER_Y+120 で画面直上からスタート）

// ======================================================
// Canvas セットアップ（論理解像度固定・CSS letterbox）
// ======================================================
const container = document.getElementById('container');
const canvas    = document.getElementById('gameCanvas');
const ctx       = canvas.getContext('2d');
canvas.width  = LOGICAL_W;
canvas.height = LOGICAL_H;

function resizeCanvas() {
  const sx = window.innerWidth  / LOGICAL_W;
  const sy = window.innerHeight / LOGICAL_H;
  const sc = Math.min(sx, sy);
  const cw = LOGICAL_W * sc;
  const ch = LOGICAL_H * sc;
  container.style.width  = cw + 'px';
  container.style.height = ch + 'px';
  canvas.style.width     = cw + 'px';
  canvas.style.height    = ch + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ======================================================
// WebAudio: ゲーム効果音（失敗しても動く）
// ======================================================
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) {}
  }
  return audioCtx;
}
function playTone(freq, type, dur, gain, delay) {
  const ac = getAudio(); if (!ac) return;
  try {
    const osc = ac.createOscillator();
    const gn  = ac.createGain();
    osc.connect(gn); gn.connect(ac.destination);
    osc.type = type; osc.frequency.value = freq;
    const t0 = ac.currentTime + (delay || 0);
    gn.gain.setValueAtTime(gain || 0.22, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.start(t0); osc.stop(t0 + dur);
  } catch(e) {}
}
// ゲート通過: ポン
function sfxGate(good) {
  playTone(good ? 660 : 280, 'sine', 0.12, 0.22, 0);
}
// ダメージ: ブブブ
function sfxDamage() {
  playTone(130, 'sawtooth', 0.18, 0.28, 0);
  playTone(90,  'sawtooth', 0.18, 0.28, 0.07);
}
// ボス登場: 重い
function sfxBoss() {
  playTone(200, 'square', 0.10, 0.18, 0);
  playTone(170, 'square', 0.12, 0.18, 0.13);
  playTone(140, 'square', 0.18, 0.18, 0.28);
}
// 勝利ファンファーレ
function sfxWin() {
  playTone(523,  'sine', 0.12, 0.28, 0);
  playTone(659,  'sine', 0.12, 0.28, 0.14);
  playTone(784,  'sine', 0.22, 0.28, 0.28);
  playTone(1047, 'sine', 0.35, 0.28, 0.46);
}
// 敗北
function sfxLose() {
  playTone(330, 'sawtooth', 0.16, 0.28, 0);
  playTone(220, 'sawtooth', 0.20, 0.28, 0.17);
  playTone(140, 'sawtooth', 0.30, 0.28, 0.36);
}

// ======================================================
// ゲーム状態変数
// ======================================================
// 'TITLE' | 'PLAYING' | 'BOSS_INTRO' | 'BOSS_BATTLE' | 'WIN' | 'LOSE'
let gameState   = 'TITLE';
let stage       = 1;
let playerX     = LOGICAL_W / 2;
let playerValue = 10;

// コースデータ
let courseObjects = []; // { type:'gate'|'enemy', x, y, screenY, ...}
let courseWorldLen = 0; // ボス出現までのworld-Y距離

// スクロール
let scrollY     = 0;   // スクロール済みworld-Y
let scrollSpeed = 0;   // px/sec (world-Y)

// ボス
let bossValue  = 0;
let bossPhase  = 0;    // 0=intro 1=battle 2=result
let bossAnimT  = 0;    // フェーズ内経過秒
let bossResult = '';   // 'win'|'lose'

// パーティクル / ポップアップ / 星
let particles = [];
let popups    = [];
let stars     = [];

// 入力
let inputLeft       = false;
let inputRight      = false;
let pointerActive   = false;
let pointerStartX   = 0;
let pointerCurrentX = 0;

// ループ用
let lastTime = 0;

// ======================================================
// 星背景
// ======================================================
function initStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x:     Math.random() * LOGICAL_W,
      y:     Math.random() * LOGICAL_H,
      r:     Math.random() * 1.5 + 0.25,
      speed: Math.random() * 65 + 20,
      alpha: Math.random() * 0.8 + 0.2,
    });
  }
}

// ======================================================
// ゲート演算子定義
// ======================================================
const OPS = [
  { label: '+5',  fn: v => v + 5,                        good: true  },
  { label: '+10', fn: v => v + 10,                       good: true  },
  { label: '+15', fn: v => v + 15,                       good: true  },
  { label: '+20', fn: v => v + 20,                       good: true  },
  { label: '×2',  fn: v => v * 2,                        good: true  },
  { label: '×3',  fn: v => v * 3,                        good: true  },
  { label: '−5',  fn: v => Math.max(0, v - 5),           good: false },
  { label: '−10', fn: v => Math.max(0, v - 10),          good: false },
  { label: '÷2',  fn: v => Math.max(0, Math.floor(v/2)), good: false },
  { label: '÷3',  fn: v => Math.max(0, Math.floor(v/3)), good: false },
];
function pickOp(good) {
  const pool = OPS.filter(o => o.good === good);
  return pool[Math.floor(Math.random() * pool.length)];
}

// ======================================================
// コース生成 & ボス値計算
// ======================================================
function buildCourse() {
  courseObjects = [];

  for (let row = 0; row < GATE_ROWS; row++) {
    const gy = COURSE_STARTWORLD_Y + row * ROW_SPACING;

    // 左右ゲートペア（片方良い・片方悪い）
    const leftGood = Math.random() < 0.5;
    const lx = 110, rx = 290;
    courseObjects.push({
      type: 'gate', x: lx, y: gy,
      op: pickOp(leftGood), passed: false, id: `g${row}L`
    });
    courseObjects.push({
      type: 'gate', x: rx, y: gy,
      op: pickOp(!leftGood), passed: false, id: `g${row}R`
    });

    // 雑魚敵（行間・確率的）
    if (row < GATE_ROWS - 1 && Math.random() < 0.55) {
      const ey = gy + ROW_SPACING * 0.5;
      const cnt = Math.random() < 0.35 ? 2 : 1;
      for (let e = 0; e < cnt; e++) {
        courseObjects.push({
          type: 'enemy',
          x:    70 + Math.random() * 260,
          y:    ey + e * 65,
          value: 3 + Math.floor(Math.random() * 7 * (1 + stage * 0.25)),
          alive: true,
          id: `e${row}_${e}`,
        });
      }
    }
  }

  courseWorldLen = COURSE_STARTWORLD_Y + GATE_ROWS * ROW_SPACING + 350;

  // ----- ボス値: 全行で最善ゲートを選んだ場合のシミュレート -----
  let sim = playerValue;
  for (let row = 0; row < GATE_ROWS; row++) {
    const rowGates = courseObjects.filter(o => o.type === 'gate' && o.id.startsWith(`g${row}`));
    let best = sim;
    for (const g of rowGates) {
      const v = g.op.fn(sim);
      if (v > best) best = v;
    }
    sim = best;
  }
  // ボス = 最善値の65%（プレイヤーが常に勝てる設計）
  const baseBoss = 30 + stage * 25;
  bossValue = Math.min(baseBoss, Math.floor(sim * 0.65));
  bossValue = Math.max(bossValue, 5);
}

// ======================================================
// ステージ初期化
// ======================================================
function initStage() {
  scrollY     = 0;
  playerX     = LOGICAL_W / 2;
  scrollSpeed = 155 + stage * 12;
  buildCourse();
  particles = [];
  popups    = [];
  bossPhase  = 0;
  bossAnimT  = 0;
  bossResult = '';
  gameState  = 'PLAYING';
}

// ======================================================
// パーティクルシステム
// ======================================================
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 * i / count) + Math.random() * 0.6;
    const s = speed * (0.4 + Math.random() * 0.9);
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      r: 2.2 + Math.random() * 3, color,
      life: 1, decay: 0.018 + Math.random() * 0.022,
      type: 'circle',
    });
  }
}
function spawnConfetti(cx, cy) {
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bdb','#fff','#ffaa44'];
  for (let i = 0; i < 75; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2.5 + Math.random() * 5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5,
      r: 4 + Math.random() * 5,
      color: colors[i % colors.length],
      life: 1, decay: 0.007 + Math.random() * 0.007,
      type: 'confetti',
      rot: Math.random() * Math.PI * 2,
      rotSpd: (Math.random() - 0.5) * 0.18,
    });
  }
}
function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color: color || '#fff', life: 1 });
}

// ======================================================
// 当たり判定
// ======================================================
function circleHit(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  return dx*dx + dy*dy < (ar+br)*(ar+br);
}
// ゲート通過: プレイヤー中心がゲートX範囲内かつY通過
function gateHit(px, py, gate) {
  const hw = GATE_W / 2 + PLAYER_R * 0.55;
  const sy = gate.screenY;
  return px > gate.x - hw && px < gate.x + hw
      && py > sy - 8       && py < sy + GATE_H + 8;
}

// ======================================================
// 更新ループ
// ======================================================
function update(dt) {
  updateStars(dt);

  if (gameState === 'TITLE' || gameState === 'WIN' || gameState === 'LOSE') {
    updateParticles(dt);
    updatePopups(dt);
    return;
  }
  if (gameState === 'BOSS_INTRO' || gameState === 'BOSS_BATTLE') {
    updateBoss(dt);
    updateParticles(dt);
    updatePopups(dt);
    return;
  }

  // ---- PLAYING ----
  // 左右移動
  const MV = 300;
  if (inputLeft)  playerX -= MV * dt;
  if (inputRight) playerX += MV * dt;
  if (pointerActive) {
    playerX += (pointerCurrentX - pointerStartX) * 0.7;
    pointerStartX = pointerCurrentX;
  }
  playerX = Math.max(PLAYER_R, Math.min(LOGICAL_W - PLAYER_R, playerX));

  // スクロール
  scrollY += scrollSpeed * dt;
  if (scrollY >= courseWorldLen) {
    gameState = 'BOSS_INTRO';
    bossPhase = 0; bossAnimT = 0;
    sfxBoss();
    return;
  }

  // コースオブジェクト: screen-Y計算 & 衝突
  for (const obj of courseObjects) {
    obj.screenY = scrollY - obj.y + PLAYER_Y;  // 正しい方向: scrollY増→screenY増（下に降りてくる）
    if (obj.screenY < -120 || obj.screenY > LOGICAL_H + 80) continue;

    if (obj.type === 'gate' && !obj.passed) {
      if (gateHit(playerX, PLAYER_Y, obj)) {
        obj.passed  = true;
        const before = playerValue;
        playerValue  = Math.max(0, obj.op.fn(playerValue));
        const diff   = playerValue - before;
        addPopup(playerX, PLAYER_Y - 56, (diff >= 0 ? '+' : '') + diff,
                 obj.op.good ? '#7fff7f' : '#ff7777');
        spawnParticles(playerX, PLAYER_Y, obj.op.good ? '#55ff88' : '#ff5555', 14, 3.5);
        sfxGate(obj.op.good);
      }
    }
    if (obj.type === 'enemy' && obj.alive) {
      if (circleHit(playerX, PLAYER_Y, PLAYER_R, obj.x, obj.screenY, ENEMY_R)) {
        obj.alive = false;
        playerValue = Math.max(0, playerValue - obj.value);
        addPopup(playerX, PLAYER_Y - 56, '-' + obj.value, '#ff4444');
        spawnParticles(obj.x, obj.screenY, '#ff5500', 18, 4.5);
        sfxDamage();
      }
    }
  }

  updateParticles(dt);
  updatePopups(dt);
}

function updateStars(dt) {
  const spd = gameState === 'PLAYING' ? scrollSpeed / 155 : 0.65;
  for (const s of stars) {
    s.y += s.speed * spd * dt;
    if (s.y > LOGICAL_H + 4) { s.y = -4; s.x = Math.random() * LOGICAL_W; }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;
    if (p.rot !== undefined) p.rot += p.rotSpd;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updatePopups(dt) {
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].y  -= 1.3;
    popups[i].life -= 0.016;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
}

function updateBoss(dt) {
  bossAnimT += dt;

  if (gameState === 'BOSS_INTRO') {
    if (bossAnimT > 1.9) {
      gameState = 'BOSS_BATTLE';
      bossPhase = 1; bossAnimT = 0;
    }
  } else if (gameState === 'BOSS_BATTLE') {
    if (bossPhase === 1 && bossAnimT > 1.4) {
      bossResult = playerValue > bossValue ? 'win' : 'lose';
      bossPhase = 2; bossAnimT = 0;
      if (bossResult === 'win') {
        sfxWin();
        spawnConfetti(LOGICAL_W / 2, LOGICAL_H / 2);
      } else {
        sfxLose();
        spawnParticles(LOGICAL_W / 2, LOGICAL_H / 2, '#ff3300', 25, 5.5);
      }
    }
    if (bossPhase === 2 && bossAnimT > 2.2) {
      gameState = bossResult === 'win' ? 'WIN' : 'LOSE';
    }
  }
}

// ======================================================
// 描画
// ======================================================
function draw() {
  // 夜空グラデーション背景
  const bg = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
  bg.addColorStop(0,   '#08021a');
  bg.addColorStop(0.5, '#130530');
  bg.addColorStop(1,   '#200a42');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  drawStars();

  if      (gameState === 'TITLE')     drawTitle();
  else if (gameState === 'PLAYING')   drawGame();
  else if (gameState === 'BOSS_INTRO' || gameState === 'BOSS_BATTLE') drawBossScene();
  else if (gameState === 'WIN')       drawResult(true);
  else if (gameState === 'LOSE')      drawResult(false);

  drawParticles();
  drawPopups();
}

// ----- 星 -----
function drawStars() {
  for (const s of stars) {
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ----- プレイヤー（青丸・にこにこ顔・頭上数値）-----
function drawPlayer(x, y, value, r, shimmer) {
  ctx.save();
  // 外周オーラ
  const aura = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
  aura.addColorStop(0, 'rgba(80,140,255,0.28)');
  aura.addColorStop(1, 'rgba(80,140,255,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(x, y, r * 2, 0, Math.PI * 2); ctx.fill();

  // 本体
  const body = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
  body.addColorStop(0, shimmer ? '#c8e8ff' : '#8ec8ff');
  body.addColorStop(1, shimmer ? '#5599ee' : '#1a4fcc');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#aaddff'; ctx.lineWidth = 2; ctx.stroke();

  // 目
  const eo = r * 0.28, er = r * 0.13;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x-eo, y-r*0.1, er*1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+eo, y-r*0.1, er*1.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111133';
  ctx.beginPath(); ctx.arc(x-eo+1, y-r*0.1+1, er*0.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+eo+1, y-r*0.1+1, er*0.7, 0, Math.PI*2); ctx.fill();
  // 笑顔
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y+r*0.18, r*0.33, 0.1, Math.PI-0.1); ctx.stroke();

  // 頭上数値（大きく）
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(r * 1.05)}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 7;
  ctx.fillText(value, x, y - r - 4);
  ctx.restore();
}

// ----- 雑魚敵（赤丸・怒り顔・頭上数値）-----
function drawEnemy(x, y, value, r) {
  ctx.save();
  const body = ctx.createRadialGradient(x-r*0.3, y-r*0.3, 0, x, y, r);
  body.addColorStop(0, '#ff9977'); body.addColorStop(1, '#bb1100');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ff5533'; ctx.lineWidth = 1.5; ctx.stroke();

  // 目
  const eo = r*0.28, er = r*0.14;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x-eo, y-r*0.1, er*1.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+eo, y-r*0.1, er*1.1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#220000';
  ctx.beginPath(); ctx.arc(x-eo, y-r*0.1, er*0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+eo, y-r*0.1, er*0.6, 0, Math.PI*2); ctx.fill();
  // 怒り眉
  ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x-eo-er, y-r*0.31); ctx.lineTo(x-eo+er*0.5, y-r*0.21); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+eo+er, y-r*0.31); ctx.lineTo(x+eo-er*0.5, y-r*0.21); ctx.stroke();
  // への字口
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y+r*0.28, r*0.25, Math.PI+0.22, -0.22); ctx.stroke();

  // 頭上ダメージ値
  ctx.fillStyle = '#ffbbbb';
  ctx.font = `bold ${Math.round(r * 0.9)}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('-' + value, x, y - r - 2);
  ctx.restore();
}

// ----- ボス（大きな紫キャラ・ツノ付き）-----
function drawBoss(x, y, value, shake) {
  const r = BOSS_R;
  const ox = shake ? (Math.random()-0.5)*10 : 0;
  const oy = shake ? (Math.random()-0.5)*10 : 0;
  ctx.save();

  // 巨大オーラ
  const aura = ctx.createRadialGradient(x+ox, y+oy, 0, x+ox, y+oy, r*2.8);
  aura.addColorStop(0, 'rgba(210,55,255,0.42)');
  aura.addColorStop(1, 'rgba(210,55,255,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(x+ox, y+oy, r*2.8, 0, Math.PI*2); ctx.fill();

  // ツノ（左右）
  ctx.fillStyle = '#ff44bb';
  ctx.beginPath();
  ctx.moveTo(x+ox-14, y+oy-r*0.85); ctx.lineTo(x+ox-7, y+oy-r*1.65);
  ctx.lineTo(x+ox-1, y+oy-r*0.7); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+ox+14, y+oy-r*0.85); ctx.lineTo(x+ox+7, y+oy-r*1.65);
  ctx.lineTo(x+ox+1, y+oy-r*0.7); ctx.closePath(); ctx.fill();

  // 本体
  const body = ctx.createRadialGradient(x+ox-r*0.3, y+oy-r*0.3, 0, x+ox, y+oy, r);
  body.addColorStop(0, '#dd88ff'); body.addColorStop(1, '#5a0088');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(x+ox, y+oy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ff88ff'; ctx.lineWidth = 3; ctx.stroke();

  // 目（黄色・強そう）
  const eo = r*0.3, er = r*0.17;
  ctx.fillStyle = '#ffdd00';
  ctx.beginPath(); ctx.arc(x+ox-eo, y+oy-r*0.12, er, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+ox+eo, y+oy-r*0.12, er, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#110022';
  ctx.beginPath(); ctx.arc(x+ox-eo+1, y+oy-r*0.12, er*0.55, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+ox+eo+1, y+oy-r*0.12, er*0.55, 0, Math.PI*2); ctx.fill();
  // ニヤリ口
  ctx.strokeStyle = '#ffaaff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x+ox, y+oy+r*0.22, r*0.42, 0.1, Math.PI-0.1); ctx.stroke();

  // 頭上数値
  ctx.fillStyle = '#ffccff';
  ctx.font = `bold ${Math.round(r*0.75)}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.shadowColor = '#ff44ff'; ctx.shadowBlur = 9;
  ctx.fillText(value, x+ox, y+oy - r - 8);
  ctx.restore();
}

// ----- ゲート -----
function drawGate(obj) {
  const x = obj.x, y = obj.screenY;
  const good = obj.op.good;
  ctx.save();

  const grad = ctx.createLinearGradient(x-GATE_W/2, y, x+GATE_W/2, y+GATE_H);
  if (good) {
    grad.addColorStop(0, 'rgba(50,200,100,0.88)');
    grad.addColorStop(1, 'rgba(20,130,55,0.88)');
  } else {
    grad.addColorStop(0, 'rgba(220,50,50,0.88)');
    grad.addColorStop(1, 'rgba(140,15,15,0.88)');
  }
  ctx.fillStyle = grad;
  ctx.strokeStyle = good ? '#77ff99' : '#ff8888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x-GATE_W/2, y, GATE_W, GATE_H, 10);
  else { // フォールバック
    ctx.rect(x-GATE_W/2, y, GATE_W, GATE_H);
  }
  ctx.fill(); ctx.stroke();

  // ハイライト
  ctx.fillStyle = good ? 'rgba(180,255,200,0.18)' : 'rgba(255,180,180,0.18)';
  ctx.beginPath(); ctx.rect(x-GATE_W/2+4, y+4, GATE_W-8, GATE_H/3); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 19px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = good ? '#00ff66' : '#ff4444'; ctx.shadowBlur = 5;
  ctx.fillText(obj.op.label, x, y + GATE_H/2);
  ctx.restore();
}

// ----- HUDバー -----
function drawHUD() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.52)';
  ctx.fillRect(0, 0, LOGICAL_W, 44);
  ctx.fillStyle = '#aabbff';
  ctx.font = 'bold 17px system-ui';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`ステージ ${stage}`, 14, 22);
  ctx.fillStyle = '#ffffaa';
  ctx.textAlign = 'right';
  ctx.fillText(`数値: ${playerValue}`, LOGICAL_W - 14, 22);
  ctx.restore();
}

// ----- プレイ中 -----
function drawGame() {
  // コースオブジェクト描画
  for (const obj of courseObjects) {
    if (obj.screenY === undefined) continue;
    if (obj.screenY < -120 || obj.screenY > LOGICAL_H + 80) continue;
    if (obj.type === 'gate'  && !obj.passed) drawGate(obj);
    if (obj.type === 'enemy' && obj.alive)   drawEnemy(obj.x, obj.screenY, obj.value, ENEMY_R);
  }
  drawPlayer(playerX, PLAYER_Y, playerValue, PLAYER_R, false);
  drawHUD();
}

// ----- ボス場面 -----
function drawBossScene() {
  const bx = LOGICAL_W / 2, by = 185;
  const shake = (gameState === 'BOSS_BATTLE' && bossPhase === 1);
  drawBoss(bx, by, bossValue, shake);

  // VSテキスト（pulsating）
  if (bossPhase <= 1) {
    const sc = 1 + 0.06 * Math.sin(bossAnimT * 4);
    ctx.save();
    ctx.translate(LOGICAL_W/2, LOGICAL_H/2 - 18);
    ctx.scale(sc, sc);
    ctx.fillStyle = '#ffee00';
    ctx.font = 'bold 52px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 22;
    ctx.fillText('VS', 0, 0);
    ctx.restore();
  }

  drawPlayer(LOGICAL_W/2, LOGICAL_H - 155, playerValue, PLAYER_R, shake);

  // 結果パネル
  if (bossPhase === 2) {
    const win = bossResult === 'win';
    ctx.save();
    ctx.fillStyle = win ? 'rgba(0,22,0,0.76)' : 'rgba(22,0,0,0.76)';
    ctx.strokeStyle = win ? '#66ff88' : '#ff6666'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(25, LOGICAL_H/2 - 68, LOGICAL_W-50, 128, 16);
    else ctx.rect(25, LOGICAL_H/2-68, LOGICAL_W-50, 128);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = win ? '#88ff88' : '#ff8888';
    ctx.font = 'bold 55px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = win ? '#00ff44' : '#ff2200'; ctx.shadowBlur = 22;
    ctx.fillText(win ? '勝利！' : '敗北…', LOGICAL_W/2, LOGICAL_H/2 - 14);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui';
    ctx.fillText(`${playerValue} vs ${bossValue}`, LOGICAL_W/2, LOGICAL_H/2 + 42);
    ctx.restore();
  }

  drawHUD();
}

// ----- タイトル画面 -----
function drawTitle() {
  ctx.save();
  ctx.fillStyle = '#ddaaff';
  ctx.font = 'bold 46px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#aa44ff'; ctx.shadowBlur = 28;
  ctx.fillText('ゲートランナー', LOGICAL_W/2, 148);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#9988aa'; ctx.font = '17px system-ui';
  ctx.fillText('Gate Runner', LOGICAL_W/2, 196);

  // デモキャラ
  drawPlayer(LOGICAL_W/2, 280, '10', 26, false);

  // 操作説明一覧
  const rows = [
    ['青/緑 ゲート', '数値UP',       '#88ff88'],
    ['赤 ゲート',    '数値DOWN',      '#ff8888'],
    ['赤い敵',       'ぶつかるとダメージ', '#ffaaaa'],
    ['ボス',         '自分 > ボス で勝利！', '#ffaaff'],
  ];
  ctx.font = '15px system-ui';
  let ly = 352;
  for (const [label, desc, col] of rows) {
    ctx.fillStyle = col; ctx.textAlign = 'left';
    ctx.fillText(label, 58, ly);
    ctx.fillStyle = '#ccccdd'; ctx.textAlign = 'left';
    ctx.fillText('→ ' + desc, 155, ly);
    ly += 30;
  }

  ctx.fillStyle = '#bbaacc'; ctx.font = '14px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('スワイプ / 矢印キー で左右移動', LOGICAL_W/2, 492);

  const blink = Math.floor(Date.now() / 560) % 2;
  ctx.fillStyle = blink ? '#fff' : '#9988bb';
  ctx.font = 'bold 23px system-ui';
  ctx.fillText('タップでスタート！', LOGICAL_W/2, 592);
  ctx.restore();
}

// ----- 結果画面 -----
function drawResult(win) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  ctx.fillStyle = win ? '#ffffaa' : '#ffaaaa';
  ctx.font = `bold ${win ? 58 : 44}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = win ? '#ffaa00' : '#ff0000'; ctx.shadowBlur = 28;
  ctx.fillText(win ? 'クリア！' : 'ゲームオーバー', LOGICAL_W/2, 195);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff'; ctx.font = 'bold 26px system-ui';
  ctx.fillText('ステージ ' + stage, LOGICAL_W/2, 285);
  ctx.fillText('最終数値: ' + playerValue, LOGICAL_W/2, 330);

  if (win) {
    const next = Math.max(10, Math.floor(playerValue * 0.7));
    ctx.fillStyle = '#aaffaa'; ctx.font = '20px system-ui';
    ctx.fillText('数値を一部引き継いで次ステージへ！', LOGICAL_W/2, 390);
    ctx.fillStyle = '#ffffcc'; ctx.font = '17px system-ui';
    ctx.fillText('引継ぎ数値: ' + next, LOGICAL_W/2, 425);
  }

  const blink = Math.floor(Date.now() / 560) % 2;
  ctx.fillStyle = blink ? '#fff' : '#888';
  ctx.font = 'bold 22px system-ui';
  ctx.fillText('タップでリトライ', LOGICAL_W/2, win ? 515 : 480);
  ctx.restore();
}

// ----- パーティクル描画 -----
function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'confetti') {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 1.6);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ----- ポップアップテキスト描画 -----
function drawPopups() {
  for (const p of popups) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 27px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
}

// ======================================================
// 入力ハンドラ
// ======================================================
function handleTap() {
  getAudio(); // AudioContext unlock
  if (gameState === 'TITLE') {
    stage = 1; playerValue = 10;
    initStars(); initStage();
  } else if (gameState === 'WIN') {
    stage++;
    playerValue = Math.max(10, Math.floor(playerValue * 0.7));
    initStage();
  } else if (gameState === 'LOSE') {
    playerValue = 10;
    initStage();
  }
}

// ----- Pointer Events（タッチ / マウス統一）-----
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (gameState !== 'PLAYING') { handleTap(); return; }
  const rect = canvas.getBoundingClientRect();
  const sx = LOGICAL_W / rect.width;
  pointerActive   = true;
  pointerStartX   = (e.clientX - rect.left) * sx;
  pointerCurrentX = pointerStartX;
  canvas.setPointerCapture(e.pointerId);
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!pointerActive) return;
  const rect = canvas.getBoundingClientRect();
  const sx = LOGICAL_W / rect.width;
  pointerCurrentX = (e.clientX - rect.left) * sx;
}, { passive: false });

canvas.addEventListener('pointerup', e => {
  e.preventDefault();
  pointerActive = false;
});
canvas.addEventListener('pointercancel', () => { pointerActive = false; });

// ----- キーボード（←→ / WASD / Space / Enter）-----
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') inputLeft  = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputRight = true;
  if ((e.key === ' ' || e.key === 'Enter') &&
      gameState !== 'PLAYING' && gameState !== 'BOSS_INTRO' && gameState !== 'BOSS_BATTLE') {
    handleTap();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') inputLeft  = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputRight = false;
});

// ======================================================
// メインゲームループ（requestAnimationFrame + deltaTime）
// ======================================================
function gameLoop(timestamp) {
  // deltaTime: 最大50ms（= 20fps相当）にクランプ
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// ======================================================
// 起動
// ======================================================
initStars();
requestAnimationFrame(ts => {
  lastTime = ts;
  requestAnimationFrame(gameLoop);
});
</script>
