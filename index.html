<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ゲートくぐりゲーム</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0015;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
  touch-action: none;
}
#gameWrapper {
  position: relative;
  width: 390px;
  height: 700px;
  max-height: 100vh;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 20px;
  box-shadow: 0 0 60px #7c3aed88, 0 0 120px #4f46e522;
}
#ui {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}
#startScreen, #gameoverScreen, #clearScreen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 18px;
  background: rgba(10,0,30,0.82);
  border-radius: 20px;
  pointer-events: all;
}
#startScreen.hidden, #gameoverScreen.hidden, #clearScreen.hidden { display: none; }
.screen-title {
  font-size: 2.6rem;
  font-weight: 900;
  background: linear-gradient(90deg, #f472b6, #a78bfa, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
  line-height: 1.2;
}
.screen-sub {
  font-size: 1rem;
  color: #c4b5fd;
  text-align: center;
  padding: 0 24px;
  white-space: pre-line;
}
.btn {
  margin-top: 8px;
  padding: 16px 52px;
  font-size: 1.3rem;
  font-weight: 900;
  border: none;
  border-radius: 40px;
  background: linear-gradient(135deg, #7c3aed, #4f46e5, #2563eb);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 24px #7c3aed88;
  transition: transform 0.1s, box-shadow 0.1s;
  letter-spacing: 0.05em;
  pointer-events: all;
}
.btn:active { transform: scale(0.95); box-shadow: 0 2px 10px #7c3aed55; }
.score-big {
  font-size: 3.5rem;
  font-weight: 900;
  color: #fbbf24;
  text-shadow: 0 0 20px #fbbf2499;
}
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="c" width="390" height="700"></canvas>
  <div id="ui">
    <div id="startScreen">
      <div class="screen-title">ゲートくぐり<br>チャレンジ!</div>
      <div class="screen-sub">ゲートをくぐって数値を増やし<br>敵を倒そう!</div>
      <button class="btn" id="startBtn">▶ スタート</button>
    </div>
    <div id="gameoverScreen" class="hidden">
      <div class="screen-title">GAME<br>OVER</div>
      <div class="screen-sub" id="goMsg"></div>
      <button class="btn" id="retryBtn">もう一度</button>
    </div>
    <div id="clearScreen" class="hidden">
      <div class="screen-title">クリア!</div>
      <div class="score-big" id="clearScore"></div>
      <div class="screen-sub" id="clearMsg"></div>
      <button class="btn" id="nextBtn">次のステージ ▶</button>
    </div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 390, H = 700;

// --- ゲーム状態 ---
let state = 'idle'; // idle | playing | gameover | clear
let stage = 1;
let playerValue = 10;
let playerX = W / 2;
let targetX = W / 2;
let particles = [];
let popups = [];
let enemies = [];
let gates = [];
let stagePhase = 'gates'; // gates | battle
let battleEnemyIndex = 0;
let battleAnim = 0;
let battleResult = null; // null | win | lose
let frameCount = 0;
let shakeX = 0, shakeY = 0;
let bgHue = 260;
let flashAlpha = 0;
let flashColor = '#fff';

// --- 定数 ---
const PLAYER_R = 26;
const ENEMY_R = 22;
const GATE_W = 90, GATE_H = 44;
const GATE_ROW_Y = [H * 0.3, H * 0.48, H * 0.63];
const PLAYER_Y = H - 90;
const PLAYER_SPEED = 0.16;

// --- ステージ設定 ---
function getStageConfig(s) {
  return {
    enemyCount: 2 + Math.min(s, 4),
    enemyValueMin: 5 + s * 3,
    enemyValueMax: 12 + s * 6,
    gateRows: Math.min(3, 1 + Math.floor(s / 2)),
    gateCols: 3,
    enemySpeed: 0.3 + s * 0.08,
    startValue: 10,
  };
}

// --- ゲート演算定義 ---
const GATE_GOOD = [
  { label: '+5',  op: v => v + 5,   color: '#34d399' },
  { label: '+10', op: v => v + 10,  color: '#22c55e' },
  { label: '+20', op: v => v + 20,  color: '#16a34a' },
  { label: 'x2',  op: v => v * 2,   color: '#60a5fa' },
  { label: 'x3',  op: v => v * 3,   color: '#3b82f6' },
  { label: '+30', op: v => v + 30,  color: '#a78bfa' },
  { label: 'x5',  op: v => v * 5,   color: '#818cf8' },
];
const GATE_BAD = [
  { label: '-5',  op: v => Math.max(1, v - 5),             color: '#f87171' },
  { label: '/2',  op: v => Math.max(1, Math.floor(v / 2)), color: '#fb923c' },
  { label: '/3',  op: v => Math.max(1, Math.floor(v / 3)), color: '#f97316' },
  { label: '-10', op: v => Math.max(1, v - 10),            color: '#ef4444' },
];

function pickGateOps(cols, s) {
  const result = [];
  for (let i = 0; i < cols; i++) {
    // ステージが上がると不利ゲートが1つ混入しやすくなる
    const useBad = (s > 1) && (i === Math.floor(cols / 2));
    if (useBad) {
      result.push(GATE_BAD[Math.floor(Math.random() * GATE_BAD.length)]);
    } else {
      result.push(GATE_GOOD[Math.floor(Math.random() * GATE_GOOD.length)]);
    }
  }
  return result;
}

function initStage() {
  const cfg = getStageConfig(stage);
  playerValue = cfg.startValue;
  playerX = W / 2;
  targetX = W / 2;
  particles = [];
  popups = [];
  enemies = [];
  gates = [];
  stagePhase = 'gates';
  battleEnemyIndex = 0;
  battleAnim = 0;
  battleResult = null;
  frameCount = 0;
  shakeX = 0; shakeY = 0;
  flashAlpha = 0;

  // 敵生成
  for (let i = 0; i < cfg.enemyCount; i++) {
    const v = cfg.enemyValueMin + Math.floor(Math.random() * (cfg.enemyValueMax - cfg.enemyValueMin));
    const hue = Math.random() * 40 + 340;
    enemies.push({
      x: 55 + (i / Math.max(cfg.enemyCount - 1, 1)) * (W - 110),
      y: -60 - i * 50,
      vy: cfg.enemySpeed + Math.random() * 0.1,
      value: v,
      r: ENEMY_R,
      color: `hsl(${hue},90%,60%)`,
      alive: true,
      settled: false,
      settleY: 72 + i * 46,
      hue,
    });
  }

  // ゲート生成
  for (let row = 0; row < cfg.gateRows; row++) {
    const y = GATE_ROW_Y[row] !== undefined ? GATE_ROW_Y[row] : H * 0.38 + row * 120;
    const ops = pickGateOps(cfg.gateCols, stage);
    const totalW = cfg.gateCols * GATE_W + (cfg.gateCols - 1) * 12;
    const startX = (W - totalW) / 2;
    for (let col = 0; col < cfg.gateCols; col++) {
      gates.push({
        x: startX + col * (GATE_W + 12),
        y: y - GATE_H / 2,
        w: GATE_W,
        h: GATE_H,
        op: ops[col],
        passed: false,
        row,
        glow: 0,
      });
    }
  }
}

// --- パーティクル ---
function spawnParticles(x, y, color, count) {
  count = count || 14;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: 0.025 + Math.random() * 0.025,
      r: 3 + Math.random() * 5,
      color,
    });
  }
}

function spawnPopup(x, y, text, color) {
  popups.push({ x, y, text, color, life: 1, vy: -1.4 });
}

// --- 入力 ---
function getCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (W / rect.width);
}

canvas.addEventListener('mousemove', function(e) {
  if (state !== 'playing' || stagePhase !== 'gates') return;
  targetX = getCanvasX(e.clientX);
});
canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (state !== 'playing' || stagePhase !== 'gates') return;
  targetX = getCanvasX(e.touches[0].clientX);
}, { passive: false });
canvas.addEventListener('mousedown', function(e) {
  if (state !== 'playing' || stagePhase !== 'gates') return;
  targetX = getCanvasX(e.clientX);
});
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (state !== 'playing' || stagePhase !== 'gates') return;
  targetX = getCanvasX(e.touches[0].clientX);
}, { passive: false });

// ボタン
document.getElementById('startBtn').onclick = function() {
  stage = 1;
  document.getElementById('startScreen').classList.add('hidden');
  startGame();
};
document.getElementById('retryBtn').onclick = function() {
  stage = 1;
  document.getElementById('gameoverScreen').classList.add('hidden');
  startGame();
};
document.getElementById('nextBtn').onclick = function() {
  stage++;
  document.getElementById('clearScreen').classList.add('hidden');
  startGame();
};

function startGame() {
  state = 'playing';
  initStage();
  bgHue = 260;
}

// --- 描画ユーティリティ ---
function drawRoundRect(x, y, w, h, r, fill, stroke, sw) {
  sw = sw || 2;
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, r);
  } else {
    // フォールバック
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

function drawCircleGrad(x, y, r, c1, c2) {
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

// --- 更新 ---
function update() {
  frameCount++;
  bgHue = (bgHue + 0.2) % 360;
  shakeX *= 0.82;
  shakeY *= 0.82;
  if (Math.abs(shakeX) < 0.1) shakeX = 0;
  if (Math.abs(shakeY) < 0.1) shakeY = 0;
  flashAlpha *= 0.88;

  // パーティクル更新
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12;
    p.vx *= 0.97;
    p.life -= p.decay;
  }
  particles = particles.filter(function(p) { return p.life > 0; });

  // ポップアップ更新
  for (let i = 0; i < popups.length; i++) {
    popups[i].y += popups[i].vy;
    popups[i].life -= 0.02;
  }
  popups = popups.filter(function(p) { return p.life > 0; });

  if (stagePhase === 'gates') {
    updateGatesPhase();
  } else if (stagePhase === 'battle') {
    updateBattlePhase();
  }
}

function updateGatesPhase() {
  // プレイヤー移動
  playerX += (targetX - playerX) * PLAYER_SPEED;
  playerX = Math.max(PLAYER_R, Math.min(W - PLAYER_R, playerX));

  // ゲート当たり判定（行ごとに1回）
  for (let i = 0; i < gates.length; i++) {
    const gate = gates[i];
    if (gate.passed) continue;
    const py = PLAYER_Y;
    if (py + PLAYER_R >= gate.y && py - PLAYER_R <= gate.y + gate.h) {
      if (playerX >= gate.x && playerX <= gate.x + gate.w) {
        // 同行のゲートをすべてpassed
        for (let j = 0; j < gates.length; j++) {
          if (gates[j].row === gate.row) gates[j].passed = true;
        }
        const oldVal = playerValue;
        playerValue = gate.op.op(playerValue);
        const diff = playerValue - oldVal;
        const sign = diff >= 0 ? '+' : '';
        spawnParticles(playerX, py, gate.op.color, 20);
        spawnPopup(playerX, py - 40, sign + diff, gate.op.color);
        gate.glow = 1;
        flashAlpha = 0.22;
        flashColor = gate.op.color;
        break;
      }
    }
  }

  // 敵降下
  let allSettled = true;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive || e.settled) continue;
    e.y += e.vy;
    if (e.y >= e.settleY) {
      e.y = e.settleY;
      e.settled = true;
    } else {
      allSettled = false;
    }
  }

  // 全ゲート行を通過 & 全敵が定位置に着いたらバトルへ
  const totalRows = new Set(gates.map(function(g) { return g.row; })).size;
  const rowsPassed = new Set(gates.filter(function(g) { return g.passed; }).map(function(g) { return g.row; })).size;

  if (rowsPassed >= totalRows && allSettled) {
    stagePhase = 'battle';
    battleAnim = 0;
    battleEnemyIndex = 0;
    spawnParticles(W / 2, H / 2, '#fbbf24', 30);
  }
}

function updateBattlePhase() {
  if (battleResult) return;
  battleAnim++;

  if (battleAnim === 80) {
    const aliveEnemies = enemies.filter(function(e) { return e.alive; });
    const e = aliveEnemies[0];
    if (!e) {
      // 全撃破
      battleResult = 'win';
      flashAlpha = 0.5;
      flashColor = '#22c55e';
      spawnParticles(W / 2, H / 2, '#fbbf24', 60);
      setTimeout(function() {
        state = 'clear';
        document.getElementById('clearScore').textContent = playerValue;
        document.getElementById('clearMsg').textContent = 'ステージ ' + stage + ' クリア!';
        document.getElementById('clearScreen').classList.remove('hidden');
      }, 1200);
      return;
    }
    if (playerValue > e.value) {
      e.alive = false;
      spawnParticles(e.x, e.y, '#fbbf24', 25);
      spawnPopup(e.x, e.y - 20, '撃破!', '#fbbf24');
      shakeX = 8; shakeY = 5;
      flashAlpha = 0.28;
      flashColor = '#fbbf24';
      battleAnim = 0;
    } else {
      battleResult = 'lose';
      shakeX = 15; shakeY = 10;
      flashAlpha = 0.6;
      flashColor = '#ef4444';
      spawnParticles(W * 0.3, H * 0.6, '#ef4444', 40);
      setTimeout(function() {
        state = 'gameover';
        document.getElementById('goMsg').textContent =
          'あなた: ' + playerValue + ' vs 敵: ' + e.value + '\nステージ ' + stage;
        document.getElementById('gameoverScreen').classList.remove('hidden');
      }, 1000);
    }
  }
}

// --- 描画 ---
var starCache = null;

function draw() {
  ctx.save();
  ctx.translate(Math.round(shakeX), Math.round(shakeY));

  // 背景グラデ
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, 'hsl(' + bgHue + ',70%,8%)');
  bg.addColorStop(0.5, 'hsl(' + ((bgHue + 40) % 360) + ',60%,12%)');
  bg.addColorStop(1, 'hsl(' + ((bgHue + 80) % 360) + ',80%,6%)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawStars();

  if (state === 'playing') {
    if (stagePhase === 'gates') {
      drawGates();
      drawEnemies();
      drawPlayer();
      drawHUD();
    } else if (stagePhase === 'battle') {
      drawBattle();
    }
  }

  // パーティクル
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ポップアップ
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.font = 'bold ' + (24 + Math.round((1 - p.life) * 10)) + 'px Arial';
    ctx.fillStyle = p.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 4;
    ctx.textAlign = 'center';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }

  // フラッシュ
  if (flashAlpha > 0.01) {
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawStars() {
  if (!starCache) {
    starCache = [];
    for (let i = 0; i < 80; i++) {
      starCache.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        b: Math.random(),
      });
    }
  }
  for (let i = 0; i < starCache.length; i++) {
    const s = starCache[i];
    const alpha = 0.3 + 0.5 * Math.abs(Math.sin(frameCount * 0.02 + s.b * 10));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.fill();
  }
}

function drawHUD() {
  ctx.font = 'bold 15px Arial';
  ctx.fillStyle = '#c4b5fd';
  ctx.textAlign = 'left';
  ctx.fillText('STAGE ' + stage, 16, 24);

  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('' + playerValue, W / 2, 27);
  ctx.shadowBlur = 0;
}

function drawGates() {
  for (let i = 0; i < gates.length; i++) {
    const gate = gates[i];
    if (gate.passed) continue;
    gate.glow = (gate.glow || 0) * 0.92;
    const { x, y, w, h, op } = gate;

    ctx.shadowColor = op.color;
    ctx.shadowBlur = 12 + (gate.glow || 0) * 20;

    // 背景グラデ
    const gg = ctx.createLinearGradient(x, y, x, y + h);
    gg.addColorStop(0, op.color + 'cc');
    gg.addColorStop(1, op.color + '44');
    drawRoundRect(x, y, w, h, 14, gg, op.color, 2.5);

    ctx.shadowBlur = 0;
    ctx.font = 'bold ' + Math.round(h * 0.54) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(op.label, x + w / 2, y + h / 2);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.shadowBlur = 0;
}

function drawFace(x, y, faceR, isEvil) {
  // 目
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - faceR * 0.3, y - faceR * 0.22, faceR * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + faceR * 0.3, y - faceR * 0.22, faceR * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = isEvil ? '#333' : '#1e40af';
  ctx.beginPath(); ctx.arc(x - faceR * 0.28, y - faceR * 0.22, faceR * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + faceR * 0.32, y - faceR * 0.22, faceR * 0.1, 0, Math.PI * 2); ctx.fill();
  // 口
  ctx.strokeStyle = isEvil ? '#333' : '#1e40af';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (isEvil) {
    ctx.arc(x, y + faceR * 0.12, faceR * 0.28, 0.2, Math.PI - 0.2); // 怒り顔
  } else {
    ctx.arc(x, y + faceR * 0.15, faceR * 0.3, 0, Math.PI); // 笑顔
  }
  ctx.stroke();
}

function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive) continue;
    const bounce = Math.sin(frameCount * 0.06 + e.hue) * 3;
    const ey = e.y + bounce;

    ctx.shadowColor = e.color;
    ctx.shadowBlur = 18;
    drawCircleGrad(e.x, ey, e.r, 'hsl(' + e.hue + ',90%,75%)', 'hsl(' + e.hue + ',90%,45%)');
    ctx.shadowBlur = 0;

    drawFace(e.x, ey, e.r, true);

    // 数値
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.strokeText('' + e.value, e.x, ey + e.r + 16);
    ctx.fillStyle = '#fff';
    ctx.fillText('' + e.value, e.x, ey + e.r + 16);
  }
}

function drawPlayer() {
  const py = PLAYER_Y;
  const bounce = Math.sin(frameCount * 0.08) * 3;

  // 影
  ctx.beginPath();
  ctx.ellipse(playerX, py + PLAYER_R + 4, PLAYER_R * 0.8, 7, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  ctx.shadowColor = '#60a5fa';
  ctx.shadowBlur = 24;
  drawCircleGrad(playerX, py + bounce, PLAYER_R, '#93c5fd', '#2563eb');
  ctx.shadowBlur = 0;

  drawFace(playerX, py + bounce, PLAYER_R, false);

  // 数値
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 3;
  ctx.strokeText('' + playerValue, playerX, py + bounce + PLAYER_R + 18);
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('' + playerValue, playerX, py + bounce + PLAYER_R + 18);
}

function drawBattle() {
  // バトル背景オーバーレイ
  const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W);
  grad.addColorStop(0, 'hsla(' + bgHue + ',70%,20%,0.5)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // タイトル
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fbbf24';
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 14;
  ctx.fillText('BATTLE!', W / 2, 55);
  ctx.shadowBlur = 0;

  const aliveEnemies = enemies.filter(function(e) { return e.alive; });
  const currentEnemy = aliveEnemies[0];

  if (currentEnemy && !battleResult) {
    const enemyX = W * 0.7;
    const enemyY = H * 0.33;
    const plX = W * 0.3;
    const plY = H * 0.58;
    const r = 36;

    // 敵キャラ
    ctx.shadowColor = currentEnemy.color;
    ctx.shadowBlur = 22;
    drawCircleGrad(enemyX, enemyY, r, 'hsl(' + currentEnemy.hue + ',90%,75%)', 'hsl(' + currentEnemy.hue + ',90%,45%)');
    ctx.shadowBlur = 0;
    drawFace(enemyX, enemyY, r, true);

    // 敵数値
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 4;
    ctx.strokeText('' + currentEnemy.value, enemyX, enemyY + r + 28);
    ctx.fillStyle = '#f87171';
    ctx.fillText('' + currentEnemy.value, enemyX, enemyY + r + 28);

    // プレイヤーキャラ
    ctx.shadowColor = '#60a5fa';
    ctx.shadowBlur = 22;
    drawCircleGrad(plX, plY, r, '#93c5fd', '#2563eb');
    ctx.shadowBlur = 0;
    drawFace(plX, plY, r, false);

    // プレイヤー数値
    ctx.font = 'bold 30px Arial';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 4;
    ctx.strokeText('' + playerValue, plX, plY + r + 28);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('' + playerValue, plX, plY + r + 28);

    // VS
    ctx.font = 'bold 44px Arial';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 20;
    ctx.fillText('VS', W / 2, H / 2 - 20);
    ctx.shadowBlur = 0;

    // 残り敵数
    ctx.font = '14px Arial';
    ctx.fillStyle = '#c4b5fd';
    ctx.fillText('残り ' + aliveEnemies.length + ' 体', W / 2, H - 55);
  }

  if (battleResult === 'win') {
    ctx.font = 'bold 52px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#22c55e';
    ctx.shadowColor = '#22c55e';
    ctx.shadowBlur = 32;
    ctx.fillText('WIN!', W / 2, H / 2 + 20);
    ctx.shadowBlur = 0;
  }
  if (battleResult === 'lose') {
    ctx.font = 'bold 52px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 32;
    ctx.fillText('LOSE...', W / 2, H / 2 + 20);
    ctx.shadowBlur = 0;
  }
}

// --- メインループ ---
function loop() {
  if (state === 'playing') update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
