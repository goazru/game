<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クリックゲーム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 1.5rem;
  }
  h1 { font-size: 2rem; color: #e94560; letter-spacing: 2px; }
  #score { font-size: 3rem; font-weight: bold; color: #0f3460; text-shadow: 0 0 20px #e94560; }
  #btn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e94560, #0f3460);
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    color: #fff;
    box-shadow: 0 0 30px #e9456066;
    transition: transform 0.08s, box-shadow 0.08s;
    user-select: none;
  }
  #btn:active { transform: scale(0.92); box-shadow: 0 0 10px #e9456033; }
  #cps { font-size: 1rem; color: #aaa; }
  #reset {
    background: none;
    border: 1px solid #e94560;
    color: #e94560;
    padding: 6px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #reset:hover { background: #e9456022; }
</style>
</head>
<body>
<h1>CLICK!</h1>
<div id="score">0</div>
<button id="btn" onclick="click_()">クリック</button>
<div id="cps">CPS: 0.0</div>
<button id="reset" onclick="reset_()">リセット</button>
<script>
  let count = 0, clicks = [], start = Date.now();
  const scoreEl = document.getElementById('score');
  const cpsEl = document.getElementById('cps');

  function click_() {
    count++;
    scoreEl.textContent = count.toLocaleString();
    clicks.push(Date.now());
    const now = Date.now();
    clicks = clicks.filter(t => now - t < 1000);
    cpsEl.textContent = `CPS: ${clicks.length}`;
  }

  function reset_() {
    count = 0; clicks = [];
    scoreEl.textContent = '0';
    cpsEl.textContent = 'CPS: 0';
  }
</script>
</body>
</html>
